name: Generate Vishu Daily Comic

on:
  schedule:
    # 19:15 IST = 13:45 UTC. Gives the publisher one hour of buffer.
    - cron: '45 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vishu-comic-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install 'Pillow==12.0.0'
      - name: Generate today's comic and manifest
        run: python scripts/generate_daily.py
      - name: Commit generated comic
        run: |
          git config user.name 'vishu-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add generated/
          if git diff --cached --quiet; then
            echo 'Already generated for today.'
            exit 0
          fi
          git commit -m "Generate Vishu comic $(date -u +%F)"
          git push
